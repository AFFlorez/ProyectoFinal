<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>Arquitectura de despliegue del pronóstico de dengue en AWS</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>

  <!-- Usuarios -->
  <rect x="20" y="210" width="150" height="110" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="95" y="242" text-anchor="middle" font-weight="700" fill="#1e1b4b">Usuario final</text>
  <text x="95" y="264" text-anchor="middle" fill="#334155">Navegador web</text>
  <text x="95" y="282" text-anchor="middle" fill="#334155">o cliente de la API</text>
  <text x="95" y="300" text-anchor="middle" fill="#334155">(JSON / CSV)</text>

  <rect x="20" y="470" width="150" height="90" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="95" y="502" text-anchor="middle" font-weight="700" fill="#1e1b4b">Equipo / tutor</text>
  <text x="95" y="524" text-anchor="middle" fill="#334155">Revisión de</text>
  <text x="95" y="542" text-anchor="middle" fill="#334155">experimentos</text>

  <!-- Nube AWS -->
  <rect x="215" y="40" width="745" height="580" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-dasharray="6 4"/>
  <text x="235" y="66" font-weight="700" fill="#9a3412">AWS Academy Learner Lab · us-east-1</text>
  <text x="235" y="86" fill="#9a3412">Pila de CloudFormation «dengue-app» (infra/cloudformation/dengue-app.yaml)</text>

  <!-- IP elástica -->
  <rect x="240" y="300" width="120" height="80" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="300" y="332" text-anchor="middle" font-weight="700" fill="#7c2d12">IP elástica</text>
  <text x="300" y="352" text-anchor="middle" fill="#334155">URL fija entre</text>
  <text x="300" y="368" text-anchor="middle" fill="#334155">sesiones del lab</text>

  <!-- Grupo de seguridad -->
  <rect x="385" y="105" width="555" height="495" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="400" y="128" font-weight="700" fill="#14532d">Grupo de seguridad: 80 (app) · 5000 (MLflow) · 22 (SSH opcional)</text>

  <!-- EC2 -->
  <rect x="405" y="142" width="515" height="440" rx="10" fill="#ffffff" stroke="#0f766e"/>
  <text x="420" y="165" font-weight="700" fill="#134e4a">EC2 t3.medium · Amazon Linux 2023 · LabInstanceProfile</text>
  <text x="420" y="184" fill="#334155">UserData: instala Docker, clona el repo, construye las imágenes, envía cfn-signal</text>

  <!-- Contenedor app -->
  <rect x="425" y="198" width="475" height="262" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text x="440" y="220" font-weight="700" fill="#164e63">Contenedor «dengue-app» · puerto 80</text>

  <rect x="445" y="232" width="200" height="105" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <text x="545" y="256" text-anchor="middle" font-weight="700" fill="#0c4a6e">Uvicorn + FastAPI</text>
  <text x="545" y="276" text-anchor="middle" fill="#334155">/ interfaz web</text>
  <text x="545" y="294" text-anchor="middle" fill="#334155">/docs API documentada</text>
  <text x="545" y="312" text-anchor="middle" fill="#334155">/api/salud monitoreo</text>
  <text x="545" y="330" text-anchor="middle" fill="#334155">/api/pronostico …</text>

  <rect x="680" y="232" width="200" height="105" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <text x="780" y="256" text-anchor="middle" font-weight="700" fill="#0c4a6e">Pronosticador</text>
  <text x="780" y="276" text-anchor="middle" fill="#334155">LSTM 64 + Dense 16</text>
  <text x="780" y="294" text-anchor="middle" fill="#334155">19.569 parámetros · 271 KB</text>
  <text x="780" y="312" text-anchor="middle" fill="#334155">escaladores de entrenamiento</text>
  <text x="780" y="330" text-anchor="middle" fill="#334155">verificación SHA-256</text>

  <rect x="445" y="348" width="200" height="100" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <text x="545" y="372" text-anchor="middle" font-weight="700" fill="#0c4a6e">Variables de entorno</text>
  <text x="545" y="392" text-anchor="middle" fill="#334155">/etc/dengue-app/app.env</text>
  <text x="545" y="410" text-anchor="middle" fill="#334155">percentiles de alerta,</text>
  <text x="545" y="428" text-anchor="middle" fill="#334155">workers, rutas, registros</text>

  <rect x="680" y="348" width="200" height="100" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <text x="780" y="372" text-anchor="middle" font-weight="700" fill="#0c4a6e">Histórico precalculado</text>
  <text x="780" y="392" text-anchor="middle" fill="#334155">serie semanal 2007-2025</text>
  <text x="780" y="410" text-anchor="middle" fill="#334155">≈ 4.900 pronósticos en un lote</text>
  <text x="780" y="428" text-anchor="middle" fill="#334155">al iniciar; consultas en ms</text>

  <!-- Contenedor MLflow -->
  <rect x="425" y="472" width="475" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="440" y="494" font-weight="700" fill="#4c1d95">Contenedor «dengue-mlflow» · puerto 5000</text>
  <text x="440" y="516" fill="#334155">100 corridas comparables (parámetros y métricas), figuras y curvas</text>
  <text x="440" y="536" fill="#334155">Model Registry: pronostico-dengue-t4 · versión 1 · alias «produccion»</text>
  <text x="440" y="556" fill="#334155">Se carga desde modelos/experimentos al iniciar (SQLite + artefactos)</text>

  <!-- Flechas -->
  <line x1="170" y1="265" x2="245" y2="315" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="196" y="280" text-anchor="middle" fill="#334155">HTTP</text>
  <line x1="170" y1="515" x2="245" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="360" y1="330" x2="441" y2="285" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="360" y1="355" x2="421" y2="510" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="645" y1="285" x2="676" y2="285" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="780" y1="337" x2="780" y2="344" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- GitHub -->
  <rect x="20" y="40" width="170" height="95" rx="10" fill="#f8fafc" stroke="#475569"/>
  <text x="105" y="68" text-anchor="middle" font-weight="700" fill="#0f172a">GitHub</text>
  <text x="105" y="88" text-anchor="middle" fill="#334155">app/ · modelos/</text>
  <text x="105" y="106" text-anchor="middle" fill="#334155">data/DatosProcesados/</text>
  <text x="105" y="124" text-anchor="middle" fill="#334155">infra/ (Docker, CFN)</text>
  <path d="M190,90 C300,90 330,150 410,160" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
  <text x="300" y="112" text-anchor="middle" fill="#475569">git clone al crear</text>

  <!-- S3 opcional -->
  <rect x="235" y="420" width="130" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-dasharray="5 4"/>
  <text x="300" y="446" text-anchor="middle" font-weight="700" fill="#0f172a">S3 (opcional)</text>
  <text x="300" y="466" text-anchor="middle" fill="#334155">modelo fuera</text>
  <text x="300" y="484" text-anchor="middle" fill="#334155">de Git</text>
  <path d="M365,450 C385,440 395,420 405,410" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
</svg>
