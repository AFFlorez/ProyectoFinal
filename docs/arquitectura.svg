<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>Arquitectura de despliegue del pronóstico de dengue en AWS</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>

  <!-- Usuario -->
  <rect x="20" y="210" width="150" height="110" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="95" y="245" text-anchor="middle" font-weight="700" fill="#1e1b4b">Usuario final</text>
  <text x="95" y="267" text-anchor="middle" fill="#334155">Navegador web</text>
  <text x="95" y="285" text-anchor="middle" fill="#334155">o cliente de la API</text>
  <text x="95" y="303" text-anchor="middle" fill="#334155">(JSON / CSV)</text>

  <!-- Nube AWS -->
  <rect x="215" y="40" width="745" height="500" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-dasharray="6 4"/>
  <text x="235" y="66" font-weight="700" fill="#9a3412">AWS Academy Learner Lab · us-east-1</text>
  <text x="235" y="86" fill="#9a3412">Pila de CloudFormation «dengue-app» (infra/cloudformation/dengue-app.yaml)</text>

  <!-- IP elástica -->
  <rect x="240" y="225" width="120" height="80" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="300" y="257" text-anchor="middle" font-weight="700" fill="#7c2d12">IP elástica</text>
  <text x="300" y="277" text-anchor="middle" fill="#334155">URL fija entre</text>
  <text x="300" y="293" text-anchor="middle" fill="#334155">sesiones del lab</text>

  <!-- Grupo de seguridad -->
  <rect x="385" y="105" width="555" height="410" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="400" y="128" font-weight="700" fill="#14532d">Grupo de seguridad: HTTP 80 (app) · SSH 22 (opcional, vockey)</text>

  <!-- EC2 -->
  <rect x="405" y="142" width="515" height="355" rx="10" fill="#ffffff" stroke="#0f766e"/>
  <text x="420" y="165" font-weight="700" fill="#134e4a">EC2 t3.medium · Amazon Linux 2023 · LabInstanceProfile</text>
  <text x="420" y="184" fill="#334155">UserData: instala Docker, clona el repo, construye la imagen, envía cfn-signal</text>

  <!-- Contenedor -->
  <rect x="425" y="200" width="475" height="280" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text x="440" y="222" font-weight="700" fill="#164e63">Contenedor Docker «dengue-app» (restart: unless-stopped)</text>

  <rect x="445" y="238" width="200" height="105" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <text x="545" y="262" text-anchor="middle" font-weight="700" fill="#0c4a6e">Uvicorn + FastAPI</text>
  <text x="545" y="282" text-anchor="middle" fill="#334155">/ interfaz web</text>
  <text x="545" y="300" text-anchor="middle" fill="#334155">/docs API documentada</text>
  <text x="545" y="318" text-anchor="middle" fill="#334155">/api/salud monitoreo</text>
  <text x="545" y="336" text-anchor="middle" fill="#334155">/api/pronostico …</text>

  <rect x="680" y="238" width="200" height="105" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <text x="780" y="262" text-anchor="middle" font-weight="700" fill="#0c4a6e">Pronosticador</text>
  <text x="780" y="282" text-anchor="middle" fill="#334155">LSTM 64 + Dense 16</text>
  <text x="780" y="300" text-anchor="middle" fill="#334155">19.569 parámetros · 271 KB</text>
  <text x="780" y="318" text-anchor="middle" fill="#334155">escaladores de entrenamiento</text>
  <text x="780" y="336" text-anchor="middle" fill="#334155">verificación SHA-256</text>

  <rect x="445" y="360" width="200" height="105" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <text x="545" y="384" text-anchor="middle" font-weight="700" fill="#0c4a6e">Variables de entorno</text>
  <text x="545" y="404" text-anchor="middle" fill="#334155">/etc/dengue-app/app.env</text>
  <text x="545" y="422" text-anchor="middle" fill="#334155">título, percentiles de alerta,</text>
  <text x="545" y="440" text-anchor="middle" fill="#334155">workers, rutas, nivel de log</text>

  <rect x="680" y="360" width="200" height="105" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <text x="780" y="384" text-anchor="middle" font-weight="700" fill="#0c4a6e">Histórico precalculado</text>
  <text x="780" y="404" text-anchor="middle" fill="#334155">serie semanal 2007-2025</text>
  <text x="780" y="422" text-anchor="middle" fill="#334155">≈ 4.900 pronósticos en un lote</text>
  <text x="780" y="440" text-anchor="middle" fill="#334155">al iniciar; consultas en ms</text>

  <!-- Flechas -->
  <line x1="170" y1="265" x2="236" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="203" y="255" text-anchor="middle" fill="#334155">HTTP</text>
  <line x1="360" y1="265" x2="441" y2="285" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="645" y1="290" x2="676" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="780" y1="343" x2="780" y2="356" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- GitHub -->
  <rect x="20" y="40" width="170" height="95" rx="10" fill="#f8fafc" stroke="#475569"/>
  <text x="105" y="68" text-anchor="middle" font-weight="700" fill="#0f172a">GitHub</text>
  <text x="105" y="88" text-anchor="middle" fill="#334155">app/ · modelos/</text>
  <text x="105" y="106" text-anchor="middle" fill="#334155">data/DatosProcesados/</text>
  <text x="105" y="124" text-anchor="middle" fill="#334155">infra/ (Docker, CFN)</text>
  <path d="M190,90 C300,90 330,150 410,160" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
  <text x="300" y="112" text-anchor="middle" fill="#475569">git clone al crear</text>

  <!-- S3 opcional -->
  <rect x="20" y="420" width="170" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-dasharray="5 4"/>
  <text x="105" y="448" text-anchor="middle" font-weight="700" fill="#0f172a">S3 (opcional)</text>
  <text x="105" y="468" text-anchor="middle" fill="#334155">paquete del modelo</text>
  <text x="105" y="486" text-anchor="middle" fill="#334155">si no está en Git</text>
  <path d="M190,460 C300,470 340,470 405,455" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
</svg>
